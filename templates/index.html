<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>面談記録アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-blue-800 text-white px-6 py-4 shadow">
        <h1 class="text-xl font-semibold">面談記録アプリ</h1>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                <div class="bg-green-100 text-green-700 border border-green-300 rounded-lg px-4 py-3 mb-4 text-sm">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}
            <h2 class="text-lg font-medium text-gray-700 mb-4">生徒を追加</h2>
            <form action="/add_student" method="POST" class="flex gap-3">
                <input type="text" name="name" placeholder="生徒の名前" required
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit"
                    class="bg-blue-700 text-white px-5 py-2 rounded-lg text-sm hover:bg-blue-800 transition">
                    新規追加
                </button>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-medium text-gray-700 mb-4">生徒一覧</h2>
            <ul class="divide-y divide-gray-100">
                {% for student in students %}
                <li>
                    <a href="/student/{{ student.id }}"
                        class="flex items-center justify-between py-3 px-2 hover:bg-gray-50 rounded-lg transition text-blue-700 font-medium">
                        {{ student.name }}
                        <span class="text-gray-400 text-sm">→</span>
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </main>
</body>
</html>
