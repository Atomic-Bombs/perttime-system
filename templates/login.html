<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 w-full max-w-sm">
        <h1 class="text-xl font-semibold text-gray-800 mb-6 text-center">面談記録アプリ</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="{% if category == 'error' %}bg-red-100 text-red-700 border border-red-300{% else %}bg-green-100 text-green-700 border border-green-300{% endif %} rounded-lg px-4 py-3 mb-4 text-sm">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-600 mb-1">ユーザー名</label>
                <input type="text" name="code" required placeholder="ユーザー名を入力"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-600 mb-1">パスワード</label>
                <input type="password" name="password" required placeholder="パスワードを入力"
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit"
                class="w-full bg-blue-700 text-white py-2 rounded-lg text-sm hover:bg-blue-800 transition">
                ログイン
            </button>
        </form>
    </div>
</body>
</html>
