<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-blue-800 text-white px-6 py-4 shadow">
        <div class="flex items-center justify-between max-w-5xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-xs font-semibold">
                    {{ current_user.code[:2].upper() }}
                </div>
                <span class="text-sm text-blue-200">{{ current_user.code }}</span>
            </div>
            <h1 class="text-xl font-semibold absolute left-1/2 transform -translate-x-1/2">面談記録アプリ</h1>
            <a href="/logout" class="text-sm bg-white text-blue-800 px-3 py-1 rounded-lg hover:bg-blue-50 transition font-medium">ログアウト</a>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <a href="/" class="text-blue-600 text-sm hover:underline">← トップに戻る</a>

        <h2 class="text-2xl font-semibold text-gray-800 mt-4 mb-6 text-center">パスワード変更</h2>

        {% if error %}
        <div class="bg-red-100 text-red-700 border border-red-300 rounded-lg px-4 py-3 mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 max-w-md mx-auto">
            <form action="/change_password" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">現在のパスワード</label>
                    <input type="password" name="current_password" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">新しいパスワード</label>
                    <input type="password" name="new_password" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">新しいパスワード（確認）</label>
                    <input type="password" name="confirm_password" required
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit"
                    class="w-full bg-blue-700 text-white py-2 rounded-lg text-sm hover:bg-blue-800 transition">
                    パスワードを変更する
                </button>
            </form>
        </div>
    </main>
</body>
</html>
